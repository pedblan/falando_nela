[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "falando-nela"
version = "0.1.0"
description = "Pipeline local-first para o corpus parlamentar Falando Nela"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2,<3",
]

[project.scripts]
falando-nela = "falando_nela.cli:main"

[dependency-groups]
analysis = [
  "duckdb>=1.4,<2",
  "pandas>=2.2,<3",
  "pyarrow>=20,<24",
]
cloud = []
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]
legacy = [
  "altair>=5,<6",
  "gradio>=4,<6",
  "ipython>=8,<10",
  "ipywidgets>=8,<9",
  "itables>=2,<3",
  "nbformat>=5.10,<6",
  "openai>=1.100,<3",
  "openpyxl>=3.1,<4",
  "pypdf>=4,<6",
]
notebooks = [
  "marimo>=0.20,<0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/falando_nela"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  "arquivo",
  "codex-skills",
  "coleta",
  "notebooks",
  "pipeline_dados_v3",
  "scripts",
  "tests/test_*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
